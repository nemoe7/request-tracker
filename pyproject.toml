[project]
name = "pwedepa"
version = "0.1.0"
description = "PwedePa: self-hosted issue and request tracker for small trusted groups"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "sqlalchemy>=2.1.4",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-xdist>=3.8.0",
  "PyYAML>=6.0",
  "ruff==0.16.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "pwedepa",
  "pwedepa.core",
  "pwedepa.data",
  "pwedepa.auth",
  "pwedepa.web",
  "pwedepa.web.routes",
]

[tool.setuptools.package-data]
"pwedepa.data" = ["domains.json", "schema.sql"]
"pwedepa.web" = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.webmanifest",
  "static/fonts/*",
  "static/icons/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
