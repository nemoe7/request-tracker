[project]
name = "pwedepa"
version = "0.1.0"
description = "PwedePa: self-hosted issue and request tracker for small trusted groups"
requires-python = ">=3.11"
dependencies = [
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-xdist>=3.8.0",
  "PyYAML>=6.0",
  "ruff==0.16.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pwedepa", "pwedepa.core", "pwedepa.data", "pwedepa.auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
