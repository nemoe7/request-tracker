# A local build: build this checkout and run it on the host.
#   docker compose -f compose.dev.yml up -d --build
# The real deployment runs the published image from compose.yml.
services:
  pwedepa:
    build: .
    image: pwedepa:dev
    container_name: pwedepa-dev
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # A local build may sign cookies with the sample secret.
      PWEDEPA_SECRET_KEY: ${PWEDEPA_SECRET_KEY:-pwedepa-dev-secret}
      PWEDEPA_ORIGIN: ${PWEDEPA_ORIGIN:-http://localhost:5000}
      PWEDEPA_ENV: dev
      PWEDEPA_CONFIG: /config/config.dev.yml
    volumes:
      - pwedepa-dev-data:/data
      - ./config.yml:/app/config.yml:ro
      - ./config.dev.yml:/config/config.dev.yml:ro
    restart: unless-stopped

volumes:
  pwedepa-dev-data:
