name: Container scan

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yml"
      - "pwedepa/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/container-scan.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "compose.yml"
      - "pwedepa/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/container-scan.yml"
  workflow_dispatch:

concurrency:
  group: container-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: "Scan the image"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      # The cache scope is its own: a scan build never evicts an image build.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: pwedepa:scan
          load: true
          cache-from: type=gha,scope=scan
          cache-to: type=gha,mode=max,scope=scan
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pwedepa:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
