name: CI

on:
  push:
    branches: [main]
    paths: &code
      - "pwedepa/**"
      - "tests/**"
      - "scripts/**"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**/*.md"
      - "Dockerfile"
      - "config*.yml"
      - "compose*.yml"
      - ".env.example"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/**"
  pull_request:
    paths: *code

# A new push stops the older run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          # The image runtime: the version the container actually runs.
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/lint_prose.py
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.0.0
        with:
          globs: "**/*.md"

  floor:
    name: Python floor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          # The floor in `pyproject.toml`: a claim nothing else tests.
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest
