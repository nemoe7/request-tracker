[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nemoizer"
version = "0.1.18"
description = "Prose, terminology, and test-assertion linter."
requires-python = ">=3.11"

[project.scripts]
nemoizer = "nemoize:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
  "nemoize",
  "prose",
  "markers",
  "nemo_markdown",
  "nemo_rules",
  "nemo_report",
  "nemo_rotate",
  "nemo_ui",
  "nemo_config",
  "nemo_files",
  "nemo_detectors",
  "nemo_assertions",
  "nemo_review",
  "nemo_runner",
]
