# The dev config: a checkout reads this file whole, in place of config.yml.
# No variable turns it on; the file sitting beside config.yml is the switch.
# The released image ships without it.

domains:
  - name: 3D Print/Model
    description: Models, parts, and print jobs.
  - name: Asset Tracker
    description: Shared gear and who holds it.
  - name: Gym
    description: Training plans and session notes.
  - name: Handyman/DIY
    description: Repairs and build projects at home.
  - name: Request Tracker
    description: This app and its own requests.
  - name: daedalus
    description: The home server and its services.

# The public address for a local run. Default: http://localhost:5000.
# origin: http://localhost:5000

# The SQLite file for a local run. Default: pwedepa.db.
# database: pwedepa.db

# Rows to insert on a first start, when the requests and issues tables are both
# empty. kind is request or issue, and status takes the values that kind knows.
seed:
  - kind: request
    title: The kitchen tap drips all night
    description: It started on Monday, and the washer looks worn.
    domain: Handyman/DIY
  - kind: issue
    title: Fit the new washer
    description: The spare sits in the drawer under the sink.
    domain: Handyman/DIY
    status: OPEN
