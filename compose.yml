services:
  pwedepa:
    build: .
    container_name: pwedepa-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PWEDEPA_SECRET_KEY: ${PWEDEPA_SECRET_KEY:?set PWEDEPA_SECRET_KEY in .env}
      PWEDEPA_ORIGIN: ${PWEDEPA_ORIGIN:-http://localhost:5000}
      PWEDEPA_RP_ID: ${PWEDEPA_RP_ID:-}
      PWEDEPA_RP_NAME: ${PWEDEPA_RP_NAME:-PwedePa}
    volumes:
      - pwedepa-data:/data
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: pwedepa-tailscale
    environment:
      # Mint an untagged auth key, so the node carries no ACL tags.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: pwedepa
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/tailscale-funnel.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-funnel.json:/config/tailscale-funnel.json:ro
    restart: unless-stopped

volumes:
  pwedepa-data:
  tailscale-state:
