services:
  pwedepa:
    build: .
    container_name: pwedepa-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PWEDEPA_RP_ID: ${PWEDEPA_RP_ID:-localhost}
      PWEDEPA_RP_NAME: ${PWEDEPA_RP_NAME:-PwedePa}
      PWEDEPA_ORIGIN: ${PWEDEPA_ORIGIN:-http://localhost:5000}
    volumes:
      - pwedepa-data:/data
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: pwedepa-tailscale
    hostname: pwedepa
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/tailscale-funnel.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-funnel.json:/config/tailscale-funnel.json:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

volumes:
  pwedepa-data:
  tailscale-state:
