# The real deployment: the published image, behind the Tailscale Funnel.
# For a local build of this checkout, use compose.dev.yml instead.
services:
  pwedepa:
    # Pin a release tag, for example :0.1.0, when the deploy must not move.
    image: ghcr.io/nemoe7/pwedepa:latest
    container_name: pwedepa-app
    ports:
      - "127.0.0.1:5000:5000"
    # The app answers this itself, and it opens the database to do it.
    # The app image carries no wget, so the probe runs python.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PWEDEPA_PORT', '5000') + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PWEDEPA_SECRET_KEY: ${PWEDEPA_SECRET_KEY:?set PWEDEPA_SECRET_KEY in .env}
      PWEDEPA_ORIGIN: ${PWEDEPA_ORIGIN:-http://localhost:5000}
      PWEDEPA_RP_ID: ${PWEDEPA_RP_ID:-}
      PWEDEPA_RP_NAME: ${PWEDEPA_RP_NAME:-PwedePa}
    volumes:
      - pwedepa-data:/data
      # Mount the real config at this path; the image carries the template.
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: pwedepa-tailscale
    environment:
      # Mint an untagged auth key, so the node carries no ACL tags.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: pwedepa
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Serve /healthz on port 9002, where the probe reads it.
      TS_ENABLE_HEALTH_CHECK: "true"
    # The node answers here itself, so a wait sees the node and not only a
    # live process. The image carries wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

volumes:
  pwedepa-data:
  tailscale-state:
